{% extends "base.html" %}
{% block title %}Մուտք գաղտնաբառով · Store Manager{% endblock %}

{% block content %}
<div class="login-wrap">
  <h1>Store Manager</h1>
  <p class="muted">
    Պահեստային մուտք։ Օգտագործեք միայն այն դեպքում, երբ Telegram-ով կոդը
    հասանելի չէ։
  </p>

  {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}

  <form method="post" action="/login/password" class="card login-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

    <label for="email">Էլ. փոստ</label>
    <input id="email" name="email" type="email" value="{{ email or '' }}"
           autocomplete="username" required autofocus>

    <label for="password">Գաղտնաբառ</label>
    <input id="password" name="password" type="password"
           autocomplete="current-password" required>

    <button type="submit">Մուտք</button>
  </form>

  <p class="muted small"><a href="/login">← Մուտք Telegram-ով</a></p>
</div>
{% endblock %}
